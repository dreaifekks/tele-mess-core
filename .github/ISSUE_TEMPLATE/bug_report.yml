name: Bug report
description: Report a reproducible problem in tele-mess-core
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include Telegram session files, tokens, phone numbers, login codes, 2FA passwords, private messages, archives, media, or unredacted logs. Report security vulnerabilities through the private process in SECURITY.md.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed all credentials, personal data, and private Telegram content.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tele-mess-core version or commit
      placeholder: "0.3.1 or a commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include Python version, operating system, installation method, and runtime mode.
      placeholder: "Python 3.12, Ubuntu 24.04, editable install, run-server"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic data and the smallest reproducible sequence.
      placeholder: |
        1. Run ...
        2. Call ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
      description: Paste only the minimum relevant, fully redacted output.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Optional context that contains no private Telegram data.
